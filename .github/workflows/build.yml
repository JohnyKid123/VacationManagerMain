name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore VacationManager/VacationManager.sln
      - name: Build
        run: dotnet build VacationManager/VacationManager.sln --no-restore
      - name: Test
        run: dotnet test VacationManager/VacationManager.sln --no-build --verbosity normal
